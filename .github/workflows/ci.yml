name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # No floating major tags since v8; this release is immutable.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ffmpeg for the worker pipeline tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - name: Web app API schema is up to date (run npm run gen:api if not)
        run: |
          uv run python -m scripts.export_openapi ../frontend/src/api/openapi.json
          git diff --exit-code ../frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # same as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match the schema
        run: npm run gen:types && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Deploys the whole stack the way a reviewer does, then checks migrations.
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Runners ship an older Compose; install.sh needs 2.39+ (same as on a clean Ubuntu).
      - uses: docker/setup-compose-action@v2
        with:
          version: latest
      # install.sh downloads the demo videos; the cache spares their hosts a fetch on every run.
      - uses: actions/cache@v6
        with:
          path: demo-data/videos
          key: demo-videos-${{ hashFiles('demo-data/videos.json') }}
      - name: Deploy
        run: ./install.sh
      - name: Re-run is safe
        run: ./install.sh
      - name: Site answers
        run: |
          curl -fsS http://localhost/api/health
          curl -fsS -o /dev/null http://localhost/docs
      - name: No service runs as root
        run: |
          procs=$(for c in $(docker compose ps -q); do docker top "$c" -o pid,uid,args; done)
          echo "$procs"
          ! echo "$procs" | awk '$2 == "0"' | grep .
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: ffmpeg for the sample video
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: End to end through nginx (upload, processing, playback, access)
        working-directory: backend
        env:
          E2E_BASE_URL: http://localhost
        run: |
          uv sync --locked
          uv run pytest tests/e2e -v
      - name: Models match migrations
        run: docker compose run --rm migrate alembic check
      - name: Migrations roll back and apply again
        run: |
          docker compose run --rm migrate alembic downgrade base
          docker compose run --rm migrate alembic upgrade head
      - name: Show services and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
