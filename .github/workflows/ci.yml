name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions by commit SHA: a tag can be moved to other code (trivy-action's were, 2026-03).
# Dependabot bumps the SHA and the version comment.

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base branch, for the migration lint
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ffmpeg for the worker pipeline tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: New migrations take no long locks (squawk)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: uv run python -m scripts.lint_migrations "$BASE_REF"
      - run: uv run pytest
      - name: Web app API schema is up to date (run npm run gen:api if not)
        run: |
          uv run python -m scripts.export_openapi ../frontend/src/api/openapi.json
          git diff --exit-code ../frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # same as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match the schema
        run: npm run gen:types && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Known issues in what we build: Dockerfile mistakes, locked libraries with fixable CVEs.
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Locked libraries (Trivy)
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  # Deploys the whole stack the way a reviewer does, then checks migrations.
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runners ship an older Compose; install.sh needs 2.39+ (same as on a clean Ubuntu).
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: latest
      # install.sh downloads the demo videos; the cache spares their hosts a fetch on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: demo-data/videos
          key: demo-videos-${{ hashFiles('demo-data/videos.json') }}
      - name: Deploy
        run: ./install.sh
      - name: Re-run is safe
        run: ./install.sh
      - name: Site answers
        run: |
          curl -fsS http://localhost/api/health
          curl -fsS -o /dev/null http://localhost/docs
      - name: No service runs as root
        run: |
          procs=$(for c in $(docker compose ps -q); do docker top "$c" -o pid,uid,args; done)
          echo "$procs"
          ! echo "$procs" | awk '$2 == "0"' | grep .
      - name: Only nginx reaches the api (it alone sets X-Forwarded-For)
        run: |
          docker compose exec -T nginx wget -q -O /dev/null http://api:8000/api/health
          docker compose exec -T worker python -c "
          import errno, socket
          assert socket.socket().connect_ex(('api', 8000)) == errno.ECONNREFUSED"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: ffmpeg for the sample video
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: End to end through nginx (upload, processing, playback, access)
        working-directory: backend
        env:
          E2E_BASE_URL: http://localhost
        run: |
          uv sync --locked
          uv run pytest tests/e2e -v
      - name: Models match migrations
        run: docker compose run --rm migrate alembic check
      - name: Migrations roll back and apply again
        run: |
          docker compose run --rm migrate alembic downgrade base
          docker compose run --rm migrate alembic upgrade head
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Our images (Trivy)
        run: |
          for image in vitube-backend vitube-worker vitube-nginx; do
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      # Report only: we can't fix them; Dependabot brings their fixed digests. gosu is never run
      # (Postgres starts as its own user).
      - name: Third-party images (Trivy, report)
        run: |
          for image in $(docker compose ps --format '{{.Image}}' | grep -v '^vitube-' | sort -u); do
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --skip-files usr/local/bin/gosu "$image"
          done
      - name: Show services and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
