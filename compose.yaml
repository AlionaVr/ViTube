# ViTube stack. Only nginx is exposed. Secrets come from .env (created by install.sh).
name: vitube

# Our containers: no privilege gain, no Linux capabilities, read-only root FS (scratch space in /tmp).
x-hardened: &hardened
  security_opt: [ "no-new-privileges:true" ]
  cap_drop: [ ALL ]
  read_only: true
  tmpfs: [ /tmp ]
  pids_limit: 256  # stops a fork bomb

# Third-party data services start as root, fix data dir owners, then drop to their own user:
# they keep only the capabilities that step needs (see cap_add).
x-data-service: &data-service
  restart: unless-stopped
  security_opt: [ "no-new-privileges:true" ]
  cap_drop: [ ALL ]
  networks: [ data ]

# One image for api, worker and migrate. Only api builds it: Compose labels an image with
# the service that built it, so three builds would give three images under one tag.
x-backend: &backend
  <<: *hardened
  image: vitube-backend
  pull_policy: never  # local image, never pulled from a registry
  restart: unless-stopped
  networks: [ data ]
  environment: &backend-env
    # vitube_app: data only, no DDL (ADR 0010). The role is set up by the migrate job.
    DATABASE_URL: postgresql+asyncpg://vitube_app:${POSTGRES_APP_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0

x-minio-image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z  # community fork, see ADR 0002

services:
  postgres:
    <<: *data-service
    image: postgres:18-alpine
    # Found by testing fresh init and restarts; DAC_READ_SEARCH (not DAC_OVERRIDE) to walk the 0700 data dir.
    cap_add: [ CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETUID ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres-data:/var/lib/postgresql  # Postgres 18+ keeps data in a versioned subdir
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *data-service
    image: redis:8-alpine
    cap_add: [ CHOWN, SETGID, SETUID ]
    # Append-only log, fsync every second: a crash loses at most 1 s, so logouts stay done (ADR 0005).
    command:
      [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes", "--appendfsync", "everysec" ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}  # lets the healthcheck's redis-cli log in
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    <<: *data-service
    image: *minio-image
    command: [ "server", "/data" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the bucket, then exit.
  minio-init:
    <<: *hardened
    image: *minio-image
    networks: [ data ]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      S3_BUCKET: ${S3_BUCKET:?}
      MC_CONFIG_DIR: /tmp/.mc  # the root FS is read-only
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "local/$$S3_BUCKET"

  # One-shot: apply DB migrations, then set up the app role, then exit. api and worker start after it.
  migrate:
    <<: *backend
    restart: "no"
    environment:
      <<: *backend-env
      # The only service with the superuser: it owns the schema.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    command: [ "sh", "-c", "alembic upgrade head && python -m app.db.roles" ]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    build:
      context: ./backend
      provenance: false  # build metadata has a timestamp: the image ID would change on every build
    init: true  # PID 1 that forwards signals and reaps child processes
    networks: [ web, data ]
    environment:
      <<: *backend-env
      SESSION_SECRET: ${SESSION_SECRET:?}  # only the api handles sessions
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    <<: *backend
    # Few processes: each ffmpeg job already uses all CPU cores.
    command: [ "celery", "-A", "app.worker.celery_app:celery_app", "worker", "--concurrency=2", "--loglevel=INFO" ]
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "celery -A app.worker.celery_app:celery_app inspect ping -d celery@$$HOSTNAME" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    <<: *hardened
    build:
      context: ./frontend
      additional_contexts:
        nginx-conf: ./nginx
      provenance: false  # same as for the backend: stable image ID
    image: vitube-nginx
    restart: unless-stopped
    networks: [ edge, web ]
    ports:
      - "${HTTP_PORT:-80}:8080"  # the unprivileged nginx listens on 8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/" ]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  edge: { }          # nginx's published port; the only network with internet access
  web:
    internal: true   # nginx <-> api
  data:
    internal: true   # api, worker, migrate <-> Postgres, Redis, MinIO

volumes:
  postgres-data:
  redis-data:
  minio-data:
