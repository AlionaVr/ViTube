# ViTube stack. Only nginx is exposed. Secrets come from .env (created by install.sh).
name: vitube

# Our containers: no privilege gain, no Linux capabilities, read-only root FS (scratch space in /tmp).
x-hardened: &hardened
  security_opt: [ "no-new-privileges:true" ]
  cap_drop: [ ALL ]
  read_only: true
  tmpfs: [ "/tmp:size=64m" ]  # RAM: capped; big work files go to volumes
  pids_limit: 256  # stops a fork bomb

# Third-party data services start as their own user, with no capabilities: the images' entrypoints
# then skip their root-only setup, as the data dirs already belong to that user.
x-data-service: &data-service
  restart: unless-stopped
  security_opt: [ "no-new-privileges:true" ]
  cap_drop: [ ALL ]
  networks: [ data ]

# api and migrate share one image, built by api: Compose labels an image with the service that
# built it, so two builds would give two images under one tag. The worker builds its own (+ ffmpeg).
x-backend: &backend
  <<: *hardened
  image: vitube-backend
  pull_policy: never  # local image, never pulled from a registry
  restart: unless-stopped
  networks: [ data ]
  environment: &backend-env
    # vitube_app: data only, no DDL (ADR 0010). The role is set up by the migrate job.
    DATABASE_URL: postgresql+asyncpg://vitube_app:${POSTGRES_APP_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0

# MinIO user of api and worker: objects in the bucket only, no admin rights (like vitube_app in Postgres).
x-storage-env: &storage-env
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: vitube-app
  S3_SECRET_KEY: ${MINIO_APP_PASSWORD:?}
  S3_BUCKET: ${S3_BUCKET:?}

x-minio-image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z  # community fork, see ADR 0002
# The image has no user of its own: fixed ids, next to the backend's 10001.
x-minio-user: &minio-user "10002:10002"

services:
  postgres:
    <<: *data-service
    image: postgres:18-alpine
    user: postgres  # uid 70 in the image; the volume's root dir is world-writable there, so initdb works too
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres-data:/var/lib/postgresql  # Postgres 18+ keeps data in a versioned subdir
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *data-service
    image: redis:8-alpine
    user: redis  # uid 999 in the image, which owns /data
    # Append-only log, fsync every second: a crash loses at most 1 s, so logouts stay done (ADR 0005).
    command:
      [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes", "--appendfsync", "everysec" ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}  # lets the healthcheck's redis-cli log in
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: hands the MinIO volume to the minio user. Older deploys ran MinIO as root and the
  # image's /data is root's, so a new volume needs it too. Safe to re-run.
  minio-perms:
    image: *minio-image
    network_mode: none
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    cap_add: [ CHOWN ]  # root keeps only this, for this one command
    read_only: true
    environment:
      MINIO_OWNER: *minio-user
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ 'chown -R "$$MINIO_OWNER" /data' ]
    volumes:
      - minio-data:/data

  minio:
    <<: *data-service
    image: *minio-image
    user: *minio-user
    networks: [ data, media ]  # media: nginx reads videos and thumbnails (ADR 0004)
    command: [ "server", "/data" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio-data:/data
    depends_on:
      minio-perms:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the bucket and the app user, then exit. Safe to re-run; sets the password each time.
  minio-init:
    <<: *hardened
    image: *minio-image
    user: *minio-user  # a client only: any unprivileged user
    networks: [ data ]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?}
      S3_BUCKET: ${S3_BUCKET:?}
      MC_CONFIG_DIR: /tmp/.mc  # the root FS is read-only
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        # The app user may touch objects in the bucket only: no bucket policies, no admin API.
        cat > /tmp/app-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject",
                       "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
            "Resource": ["arn:aws:s3:::$$S3_BUCKET/*"]
          }]
        }
        EOF
        mc admin policy create local vitube-app /tmp/app-policy.json
        mc admin user add local vitube-app "$$MINIO_APP_PASSWORD"
        mc admin policy attach local vitube-app --user vitube-app
        # Anonymous reads of processed files only, for nginx on the internal "media" network after
        # the API's check (ADR 0004). Originals stay unreadable.
        cat > /tmp/media-read.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"AWS": ["*"]},
            "Action": ["s3:GetObject"],
            "Resource": ["arn:aws:s3:::$$S3_BUCKET/videos/*", "arn:aws:s3:::$$S3_BUCKET/thumbs/*"]
          }]
        }
        EOF
        mc anonymous set-json /tmp/media-read.json "local/$$S3_BUCKET"

  # One-shot: apply DB migrations, then set up the app role, then exit. api and worker start after it.
  migrate:
    <<: *backend
    restart: "no"
    environment:
      <<: *backend-env
      # The only service with the superuser: it owns the schema.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    command: [ "sh", "-c", "alembic upgrade head && python -m app.db.roles" ]
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: demo accounts and videos. install.sh runs it after `up` (`compose run --rm seed`):
  # `up --wait` fails on a job that exits fast with nothing depending on it. Safe to re-run.
  seed:
    <<: *backend
    restart: "no"
    profiles: [ seed ]
    environment:
      <<: [ *backend-env, *storage-env ]
      DEMO_PASSWORD: ${DEMO_PASSWORD:?}
    command: [ "python", "-m", "app.seed" ]
    volumes:
      - ./demo-data:/demo-data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      worker:  # takes the queued videos; the seed waits for them
        condition: service_started

  api:
    <<: *backend
    build:
      context: ./backend
      target: app
      provenance: false  # build metadata has a timestamp: the image ID would change on every build
    init: true  # PID 1 that forwards signals and reaps child processes
    # Uploads hold at most 32 × 16 MiB (ADR 0006); the rest is the app. A leak can't take the host.
    mem_limit: 1g
    networks:
      web:
        aliases: [ api-web ]  # a name for the api's address on "web" only
      data: { }
      oauth-egress: { }  # the token and keys endpoints of Google sign-in (ADR 0014)
    environment:
      <<: [ *backend-env, *storage-env ]
      # Listens on "web" only: nginx alone can connect, so it alone sets X-Forwarded-For.
      # Neighbours on "data" and "oauth-egress" get "connection refused".
      UVICORN_HOST: api-web
      SESSION_SECRET: ${SESSION_SECRET:?}  # only the api handles sessions
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Sign-in with Google, off while the client id is empty (README)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/auth/google/callback}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-1024}
      MAX_VIDEO_DURATION_SEC: ${MAX_VIDEO_DURATION_SEC:-1800}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://api-web:8000/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    <<: *backend
    build:
      context: ./backend
      target: worker
      provenance: false
    image: vitube-worker
    environment:
      <<: [ *backend-env, *storage-env ]
      MAX_VIDEO_DURATION_SEC: ${MAX_VIDEO_DURATION_SEC:-1800}
      MAX_VIDEO_HEIGHT: ${MAX_VIDEO_HEIGHT:-720}
      SCRATCH_DIR: /scratch
    volumes:
      - worker-scratch:/scratch  # ffmpeg's work files: up to a few GB, too big for RAM
    # Two ffmpeg jobs up to 4K need ~1-1.5 GB each; a decoder bomb is killed, not the host.
    mem_limit: 3g
    # A lower CPU share, not a cap: transcoding uses idle cores but yields to api and nginx.
    cpu_shares: 256
    # Few processes: each ffmpeg job already uses all CPU cores. -B: the sweeper's schedule runs
    # here too (ADR 0003); fine with one worker container.
    command:
      [ "celery", "-A", "app.worker.celery_app:celery_app", "worker", "-B", "--schedule", "/tmp/celerybeat-schedule",
        "--concurrency=2", "--loglevel=INFO" ]
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "celery -A app.worker.celery_app:celery_app inspect ping -d celery@$$HOSTNAME" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    <<: *hardened
    build:
      context: ./frontend
      additional_contexts:
        nginx-conf: ./nginx
      provenance: false  # same as for the backend: stable image ID
    image: vitube-nginx
    restart: unless-stopped
    networks: [ edge, web, media ]
    environment:
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-1024}
      S3_BUCKET: ${S3_BUCKET:?}
      NGINX_ENVSUBST_FILTER: ^(MAX_UPLOAD_SIZE_MB|S3_BUCKET)$$  # only these; nginx's own $$vars stay
    tmpfs: [ "/tmp:size=64m", "/etc/nginx/conf.d:uid=101,gid=101" ]  # the rendered config; nginx runs as 101
    ports:
      - "${HTTP_PORT:-80}:8080"  # the unprivileged nginx listens on 8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/" ]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  edge: { }          # nginx's published port, with internet access
  web:
    internal: true   # nginx <-> api
  data:
    internal: true   # api, worker, migrate <-> Postgres, Redis, MinIO
  media:
    internal: true   # nginx -> MinIO, reads of processed files
  oauth-egress: { }  # api -> Google sign-in; internet, as Docker can't limit it to Google (ADR 0008)

volumes:
  postgres-data:
  redis-data:
  minio-data:
  worker-scratch:
