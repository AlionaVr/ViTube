# Docker DNS: re-resolve "api" at runtime, so an api restart with a new IP doesn't break proxying.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Basic hardening. CSP comes with the security stage.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api;
    }

    location = /docs {
        proxy_pass http://api;
    }

    # File names have content hashes, so they can be cached forever.
    location /assets/ {
        expires 1y;
    }

    # Always revalidate, so a new deploy is picked up at once.
    location = /index.html {
        expires -1;
    }

    # SPA: unknown paths get index.html, React Router handles them.
    location / {
        try_files $uri /index.html;
    }
}
