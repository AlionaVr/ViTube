[project]
name = "vitube"
version = "0.1.0"
description = "ViTube backend: FastAPI API and Celery worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiobotocore>=3.10.0",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "testcontainers[minio,postgres,redis]>=4.15.0",
    "types-aiobotocore[s3]>=3.10.0",
]

[tool.uv]
package = false  # an app, not a library: run from source, no install step

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake passwords are normal in tests

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"  # async tests and fixtures need no marker
# One event loop for the run: the app's DB and Redis connections belong to the loop that made them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
